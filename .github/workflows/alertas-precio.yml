name: Alertas de precio

# Llama a /api/cron/alertas-precio cada 5 minutos. Vercel Hobby no admite crons
# tan frecuentes, así que el reloj lo pone GitHub Actions.
# Secretos del repositorio: SITE_URL (https://tu-dominio, sin barra final) y CRON_SECRET,
# el mismo valor que la variable CRON_SECRET de Vercel.
# Las ejecuciones programadas de Actions pueden retrasarse unos minutos.
# Lanzado a mano con dry_run activado, consulta precios pero no envía ni guarda nada.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run: no envía mensajes ni guarda estado"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: alertas-precio
  cancel-in-progress: false

jobs:
  alertas:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Llamar a la ruta de alertas
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Faltan los secretos SITE_URL y CRON_SECRET, se omite."
            exit 0
          fi
          curl --silent --show-error --fail-with-body --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/alertas-precio?dry_run=$DRY_RUN"
