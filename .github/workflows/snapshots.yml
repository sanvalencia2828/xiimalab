name: Snapshots de convocatorias

# Guarda en Supabase las hackatones y bounties abiertos (scripts/snapshot.ts).
# Secretos del repositorio: SUPABASE_URL y SUPABASE_SERVICE_ROLE_KEY.
# Si faltan, el job termina bien con "Supabase no configurado, se omite".

on:
  schedule:
    - cron: "0 */6 * * *" # cada 6 horas (UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
